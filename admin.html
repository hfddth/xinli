<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Mind Explorer | 问卷管理后台</title>
    <link rel="stylesheet" href="./styles.css?v=admin-live-20260821-1" />
  </head>
  <body class="admin-live-page">
    <main class="admin-live-shell">
      <header class="admin-live-header">
        <div>
          <p class="eyebrow">MIND EXPLORER · SECURE ADMIN</p>
          <h1>问卷管理后台</h1>
          <p>页面仅能通过 SSH 加密通道访问，每 15 秒自动同步一次。</p>
        </div>
        <div class="admin-live-actions">
          <button class="ghost-button" id="refresh-admin" type="button">立即刷新</button>
          <a class="primary-button primary-button--compact" href="./api/admin/export.csv">导出全部 CSV</a>
        </div>
      </header>
      <section class="admin-live-kpis" aria-label="问卷统计">
        <article><span>全部问卷</span><strong id="total-count">—</strong></article>
        <article><span>今日新增</span><strong id="today-count">—</strong></article>
        <article><span>最近同步</span><strong id="last-sync">—</strong></article>
      </section>
      <section class="admin-live-panel">
        <div class="admin-live-panel__heading">
          <div><h2>最近提交</h2><p id="admin-status">正在读取腾讯云数据库…</p></div>
          <label>搜索记录 <input id="admin-search" type="search" placeholder="匿名编号或记录编号" /></label>
        </div>
        <div class="admin-table-wrap">
          <table class="admin-table">
            <thead><tr><th>完成时间</th><th>匿名编号</th><th>原始选项</th><th>操作</th></tr></thead>
            <tbody id="admin-records"><tr><td colspan="4">正在加载…</td></tr></tbody>
          </table>
        </div>
      </section>
      <dialog class="admin-detail-dialog" id="admin-detail">
        <div class="admin-detail-toolbar"><h2>问卷详情</h2><button class="ghost-button" id="close-detail" type="button">关闭</button></div>
        <div id="admin-detail-content"></div>
      </dialog>
    </main>
    <script src="./admin.js?v=answers-only-20260822-1"></script>
  </body>
</html>
